[package]
name = "boringbib"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A boring BibTeX formatter"
license = "MIT"
readme = "README.md"
repository = "https://github.com/nanxstats/boringbib"
keywords = ["bibtex", "bibliography", "formatter", "latex", "cli"]
categories = ["command-line-utilities", "text-processing"]
authors = ["Nan Xiao <me@nanx.me>"]
exclude = ["/deps-src", "/.github", "/okr.toml", "/okr.lock"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
deunicode = "1.6.2"
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.2.0"
thiserror = "2.0.20"
toml = "1.1.6"
unicode-normalization = "0.1.25"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
predicates = "3.1.4"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
